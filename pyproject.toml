[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "otasentry"
version = "0.1.0"
description = "Context-aware differential validation of over-the-air vehicle software updates from CAN logs"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["automotive", "OTA", "CAN", "DBC", "validation", "anomaly-detection", "software-defined-vehicle"]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.3",
  "cantools>=39",
  "pyyaml>=6.0",
  "jinja2>=3.1",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
otasentry = "otasentry.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
otasentry = ["templates/*.j2", "assets/*"]

[tool.ruff]
line-length = 110
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905", "B023"]

[tool.pytest.ini_options]
testpaths = ["tests"]
