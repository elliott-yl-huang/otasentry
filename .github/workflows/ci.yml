name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: pip install -e ".[dev,api]"
      - run: ruff check src tests scripts
      - run: pytest -q

  demo:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -e ".[dev,api]"
      - name: Simulate a fleet campaign and gate it
        run: |
          otasentry simulate --out runs/campaign --vehicles 8 --duration 600 --seed 7
          otasentry analyze runs/campaign --out runs/report --no-llm
          otasentry gen-tests --baseline runs/campaign/pre --findings runs/report/findings.json --out runs/generated/test_vehicle.py
      - name: Generated suite passes on a known-good log
        run: OTASENTRY_LOG=runs/campaign/pre/SIM1000.log pytest -q -p no:cacheprovider runs/generated/test_vehicle.py
      - uses: actions/upload-artifact@v4
        with:
          name: otasentry-report
          path: |
            runs/report
            runs/generated
